name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract test statistics from npm test output or generate summary
          echo "✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Files:" >> $GITHUB_STEP_SUMMARY
          echo "- loanService.test.ts - Business logic tests" >> $GITHUB_STEP_SUMMARY
          echo "- LoanForm.test.ts - Form component tests" >> $GITHUB_STEP_SUMMARY
          echo "- LoanList.test.ts - List component tests" >> $GITHUB_STEP_SUMMARY
          echo "- LoanSummary.test.ts - Summary component tests" >> $GITHUB_STEP_SUMMARY
          echo "- App.test.ts - Integration tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All business logic functions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All Vue components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All user interactions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Edge cases and error scenarios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **HTML Report:** Download the 'test-results' artifact to view detailed test results" >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build
